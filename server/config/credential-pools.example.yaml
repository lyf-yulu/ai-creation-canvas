# Documentation fixture only. Copy outside the repository, replace every fake
# value through the deployment secret manager, chmod 0600, then point
# --credential-pools and --credential-pools-root at that protected location.
version: 1
pools:
  nano-banana-official:
    provider: google-images
    group: official
    allowed_families: [nano-banana]
    keys:
      - id: official-primary
        api_key: FAKE_REPLACE_FROM_SECRET_MANAGER
        max_concurrency: 1
  nano-banana-t8-gemini:
    provider: t8star
    group: gemini
    allowed_families: [nano-banana]
    keys:
      - id: t8-gemini-primary
        api_key: FAKE_REPLACE_FROM_SECRET_MANAGER
        max_concurrency: 1
  t8-cc-negative-control:
    provider: t8star
    group: cc
    allowed_families: [claude]
    keys:
      - id: t8-cc-primary
        api_key: FAKE_REPLACE_FROM_SECRET_MANAGER
        max_concurrency: 1
